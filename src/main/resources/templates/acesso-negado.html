<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments :: pageHead('Acesso negado')}"></th:block>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container">
    <div class="card center-box">
        <div class="emoji">🚫</div>
        <h1>Acesso negado</h1>
        <p class="subtitle">O seu perfil não tem permissão para acessar esta página.</p>
        <div class="form-actions" style="justify-content:center;">
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-primary">Voltar ao painel</a>
            <a sec:authorize="hasRole('CLIENTE')" th:href="@{/cliente}" class="btn btn-primary">Voltar para minha área</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-primary">Entrar</a>
            <a th:href="@{/}" class="btn btn-outline">Início</a>
        </div>
    </div>
</div>
</body>
</html>
