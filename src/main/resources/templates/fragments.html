<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Fragments</title>
</head>
<body>

<th:block th:fragment="pageHead(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | Mercado Express'">Mercado Express</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</th:block>

<nav class="navbar" th:fragment="navbar">
    <a th:href="@{/}" class="brand">🛒 Mercado<span class="dot">Express</span></a>

    <div class="nav-links" sec:authorize="isAuthenticated()">
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Painel</a>
        <a sec:authorize="hasRole('CLIENTE')" th:href="@{/cliente}">Minha área</a>
        <a th:href="@{/produtos}">Produtos</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/produtos/novo}">Novo produto</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/usuarios}">Usuários</a>
    </div>

    <div class="nav-actions">
        <span class="user-chip" sec:authorize="isAuthenticated()">
            👤 <span sec:authentication="name">usuario</span>
            <span class="badge badge-admin" sec:authorize="hasRole('ADMIN')">ADMIN</span>
            <span class="badge badge-cliente" sec:authorize="hasRole('CLIENTE')">CLIENTE</span>
        </span>
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Entrar</a>
        <a sec:authorize="!isAuthenticated()" th:href="@{/cadastro}" class="nav-cta">Criar conta</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <button type="submit">Sair</button>
        </form>
    </div>
</nav>

<th:block th:fragment="alerts">
    <div class="alert alert-success" th:if="${mensagemSucesso}" th:text="${mensagemSucesso}">Sucesso</div>
    <div class="alert alert-error" th:if="${mensagemErro}" th:text="${mensagemErro}">Erro</div>
</th:block>

<footer class="footer" th:fragment="footer">
    Mercado Express · CP5 Java Advanced · FIAP TDS · Spring Boot + Spring Security + PostgreSQL
</footer>

</body>
</html>
