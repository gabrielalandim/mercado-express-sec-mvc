<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: pageHead('Minha área')}"></th:block>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <div class="welcome">
        <h1 th:text="'Olá, ' + ${usuario != null ? usuario.nome : 'cliente'} + '! 🛍️'">Olá!</h1>
        <p>
            Bem-vindo(a) à sua área no Mercado Express.
            <span th:if="${usuario != null}" th:text="'Cliente desde ' + ${#temporals.format(usuario.dataCadastro, 'dd/MM/yyyy')} + ' · ' + ${usuario.email}"></span>
        </p>
    </div>

    <div class="page-header">
        <div>
            <h2 style="margin:0;">Catálogo de produtos</h2>
            <p class="subtitle">Clique em um produto para ver todos os detalhes.</p>
        </div>
    </div>

    <form class="search-bar" th:action="@{/cliente}" method="get">
        <input type="text" name="busca" th:value="${busca}" placeholder="Buscar por nome ou tipo">
        <button type="submit" class="btn btn-outline">🔎 Buscar</button>
        <a th:if="${busca}" th:href="@{/cliente}" class="btn btn-outline">Limpar</a>
    </form>

    <div class="product-grid" th:if="${not #lists.isEmpty(produtos)}">
        <div class="product-card" th:each="p : ${produtos}">
            <span class="badge" th:text="${p.tipo}">Tipo</span>
            <h3 th:text="${p.nome}">Produto</h3>
            <div class="meta" th:text="${p.tamanho} + ' · ' + ${p.setor}">Tamanho · Setor</div>
            <div class="price" th:text="${'R$ ' + #numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</div>
            <div class="meta" th:text="${p.estoque gt 0 ? 'Em estoque: ' + p.estoque + ' un.' : 'Esgotado'}">Estoque</div>
            <a th:href="@{/produtos/{id}(id=${p.id})}" class="btn btn-outline btn-sm">Ver detalhes</a>
        </div>
    </div>

    <div class="card empty-state" th:if="${#lists.isEmpty(produtos)}">
        <span class="emoji">🔍</span>
        <p>Nenhum produto encontrado.</p>
    </div>
</div>
</body>
</html>
