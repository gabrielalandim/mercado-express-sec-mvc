server:
  port: ${PORT:8080}

spring:
  application:
    name: mercadoexpress

  # ===== PostgreSQL =====
  # Local: usa o Postgres do docker-compose.yml (localhost:5432/mercadoexpress)
  # Deploy (Render): DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD vêm das variáveis de ambiente
  # Também é possível informar a URL JDBC completa em DB_URL (ex.: Neon, Supabase)
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mercadoexpress}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

# Usuário administrador criado automaticamente na primeira execução
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  seed-demo-data: ${SEED_DEMO_DATA:true}
